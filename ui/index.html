  <script>
    /* Apply saved theme and row density before first paint (no flash). */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('orbit.settings') || '{}') || {};
        var themes = ['night', 'void', 'signal', 'daylight'];
        var d = document.documentElement;
        d.setAttribute('data-theme', themes.indexOf(s.theme) >= 0 ? s.theme : 'night');
        if (s.compact === true) d.classList.add('compact');
        if (s.reducedMotion === true) d.classList.add('reduce-motion');
      } catch (e) { /* storage blocked: defaults apply */ }
    })();
  </script>
