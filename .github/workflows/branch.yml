# Checks a release branch (v0.9, v1.0, ...) on Windows on every push: the Rust unit tests, the
# UI smoke test in the runner's Microsoft Edge, and a release build of orbit.exe kept for 7 days
# so the build can be tried on a real PC before the release. Tags and main use ci.yml/release.yml.
name: Branch

on:
  push:
    branches: ['v*']

permissions:
  contents: read

concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      # Uses the Microsoft Edge that windows-latest already has, so no browser download.
      - name: UI smoke test
        env:
          ORBIT_BROWSER: msedge
        run: npm run test:ui

      - name: Release build
        working-directory: src-tauri
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ github.ref_name }}-${{ github.sha }}
          path: src-tauri/target/release/orbit.exe
          if-no-files-found: error
          retention-days: 7
